name: WIT Radio checks
on:
  pull_request:
  push:
    branches: [main, 'improve/**']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install pyyaml httpx qrcode pillow
      - run: python -m unittest discover -s tests -v
  player:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node --check web/player.js && node tests/player-state.cjs && node tests/player-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-previews
          path: artifacts/*.png
