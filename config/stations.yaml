default_station: writ-fm

stations:
  writ-fm:
    call_sign: WIT Radio
    agent:
      kind: gemini
      command: python3
      args:
        - tools/gemini_prompt_cli.py
    paths:
      output_dir: output
      home_dir: ~/.writ
      schedule_path: config/schedule.yaml
    stream:
      icecast_host: localhost
      icecast_port: 8000
      mount: /stream
      api_port: 8001
      source_password_env: WRIT_SOURCE_PASSWORD
      stream_name: WIT Radio
      stream_genre: AI Radio
      stream_description: AI-powered radio from We Insure Things

  klod-fm:
    call_sign: KLOD-FM
    agent:
      kind: gemini
      command: python3
      args:
        - tools/gemini_prompt_cli.py
    paths:
      output_dir: output/stations/klod-fm
      home_dir: ~/.writ/stations/klod-fm
      schedule_path: config/schedule.yaml
    stream:
      icecast_host: localhost
      icecast_port: 8000
      mount: /klod-fm
      api_port: 8011
      source_password_env: WRIT_SOURCE_PASSWORD
      stream_name: KLOD-FM
      stream_genre: AI Radio
      stream_description: Gemini-directed autonomous radio

  cdex-fm:
    call_sign: CDEX-FM
    agent:
      kind: codex
      command: codex
    paths:
      output_dir: output/stations/cdex-fm
      home_dir: ~/.writ/stations/cdex-fm
      schedule_path: config/cdex_schedule.yaml
    stream:
      icecast_host: localhost
      icecast_port: 8000
      mount: /cdex-fm
      api_port: 8012
      source_password_env: WRIT_SOURCE_PASSWORD
      stream_name: CDEX-FM
      stream_genre: AI Radio
      stream_description: Codex directed autonomous radio

  # WIT-FM Next: the overhaul, built beside the live station on its own mount
  # (development plan, Phase 0). It replaces /stream at the Phase 3 cutover.
  # Scripts come from one OpenAI-compatible endpoint on the Halo; there is no
  # operator agent loop. Classical runs from a deterministic planner.
  wit-next:
    call_sign: WIT-FM Next
    agent:
      kind: openai
    llm:
      base_url: http://halo.local:8080/v1   # any OpenAI-compatible server
      model: ${SCRIPT_MODEL}                # swap freely; must pass the show test set
    paths:
      output_dir: output/stations/wit-next
      home_dir: ~/.writ/stations/wit-next
      schedule_path: config/wit_next_schedule.yaml
    stream:
      icecast_host: localhost
      icecast_port: 8000
      mount: /next
      api_port: 8002
      source_password_env: WRIT_SOURCE_PASSWORD
      stream_name: WIT-FM Next
      stream_genre: Radio
      stream_description: Staging mount for the WIT-FM overhaul
