# Respellings for the voice engines (show bible: voice cards). Open models
# stumble on hard names, so the text sent to an engine is respelled first.
# Scripts, credits, now-playing and the fact check keep the real spelling.
# Whole words only; the longest match wins. Composers first.

global:
